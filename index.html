<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Forwarder - Config Encryptor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #34d399;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            box-sizing: border-box;
            margin-top: 15px;
        }
        .credit {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔒 Config Encryptor</h2>
        
        <div class="form-group">
            <label for="botToken">Telegram Bot Token:</label>
            <input type="text" id="botToken" placeholder="e.g., 123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ">
        </div>

        <div class="form-group">
            <label for="chatId">Telegram Chat ID:</label>
            <input type="text" id="chatId" placeholder="e.g., 987654321">
        </div>

        <button onclick="generateConfig()">Generate Base64</button>

        <label style="margin-top: 15px;">Generated Encrypted String:</label>
        <textarea id="output" readonly placeholder="Your encrypted config will appear here..."></textarea>

        <div class="credit">Developed by DebDas | @zerodeb</div>
    </div>

    <script>
        function generateConfig() {
            let token = document.getElementById("botToken").value.trim();
            let chat = document.getElementById("chatId").value.trim();

            if (!token || !chat) {
                alert("দয়া করে Bot Token এবং Chat ID উভয়ই দিন!");
                return;
            }

            // Token এবং Chat ID কে '|' দিয়ে জোড়া লাগানো
            let combined = token + "|" + chat;

            // Base64 এ এনক্রিপ্ট করা
            let encoded = btoa(combined);

            // আউটপুট টেক্সটবক্সে দেখানো
            document.getElementById("output").value = encoded;
        }
    </script>

</body>
</html>
